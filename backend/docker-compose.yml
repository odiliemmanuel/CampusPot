services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuspot
      POSTGRES_PASSWORD: campuspot
      POSTGRES_DB: campuspot_dev
    ports:
      - "5432:5432"
    volumes:
      - campuspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspot -d campuspot_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campuspot_pgdata:
