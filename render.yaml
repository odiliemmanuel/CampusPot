# Render Blueprint for the CampusPot API.
#
# Database is Neon (external) — no Render Postgres here. Set DATABASE_URL and
# CORS_ORIGINS in the Render Dashboard after the first deploy (sync:false keeps
# them out of the repo).
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# The Blueprint must live in the repo ROOT for Render to auto-detect it.
services:
  - type: web
    name: campuspot-api
    runtime: docker
    # Paths are relative to the repository root. dockerContext keeps the build
    # context at backend/ so the Dockerfile's COPY paths resolve correctly.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: GORM_LOG
        value: warn
      # Generated once by Render — never committed.
      - key: JWT_SECRET
        generateValue: true
      # Neon connection string: host + user + password + db (sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Your Vercel URL(s), comma-separated, e.g. https://campuspot.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Sandbox only: no B Moni key -> the in-process mock is used.
      - key: BMONI_SANDBOX
        value: "true"
      # Give every new pot a random opening float, and auto-seed an empty DB.
      - key: DEMO_OPENING_BALANCE
        value: "true"
      - key: AUTO_SEED
        value: "true"
